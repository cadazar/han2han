[package]
name = "han2han_tools"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "han2han_tools"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26.0", features = ["extension-module"]}
once_cell = "1.20"
hashbrown = "0.16.0"
regex = "1.11"
# note — the polars dependency leads to lengthy compile times so we don't use it
# polars = { version = "0.46.0", features = ["ipc", "lazy", "dtype-full"] }
# tokenizers = { version = "0.21.1", default-features = false, features = ["onig"] }
# indicatif = { version = "0.17.8", features = ["rayon"] }
# rayon = "1.10.0"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1